<!DOCTYPE html>

<!-- File origin: VS1LAB A1a -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTagApp</title>
    <link rel="stylesheet" href="./stylesheets/style.css" />
</head>

<body>
    <header class="header">
        <img src="./images/location.png" class="header__image" alt="an image of a map and location">
        <h1 class="header__title">GeoTagApp</h1>
        <nav class="header__navigation">
            <a href="#">About</a> | <a href="#">Help</a> | <a href="/">Home</a>
        </nav>
    </header>

    <main class="main">
        <section class="main__tagging tagging">
            <h2>Tagging</h2>

            <!-- ############### VS1Lab 1a Form 1 Start -->
            <form id="tag-form" action="/tagging" method="post">

                <fieldset>
                    <legend>Add a new GeoTag</legend>

                    <label for="latitude">Latitude:</label>
                    <input name="latitude" id="latitude" type="text" value="49.01379" readonly/>

                    <label for="longitude">Longitude:</label>
                    <input name="longitude" id="longitude" type="text" value="8.390071" readonly/>

                    <label for="name">Name:</label>
                    <input name="name" id="name" type="text" placeholder="e.g. Central Berlin" pattern="\w{1,10}" required/>

                    <label for="hashtag">Hashtag:</label>
                    <input name="hashtag" id="hashtag" type="text" placeholder="e.g. #ber" pattern="[#]{0,1}\w{1,10}" required/>

                    <button type="button" id="form1button">Add Tag</button>

                </fieldset>

            </form>
            <!-- ############### VS1Lab 1a Form 1 End -->

        </section>

        <section class="main__discovery discovery">
            <h2 class="discovery__title">Discovery</h2>

            <!-- ############### VS1Lab 1a Form 2 Start -->
            <form class="discovery__search" id="discoveryFilterForm" action="/discovery" method="post">

                <fieldset>
                    <legend>Search</legend>

                    <label for="search">Search term or keywords:</label>
                    <input type="text" name="search" id="search" placeholder="e.g. Berlin">

                    <input name="latitude" id="latitude-hidden" type="text" value="49.01379" hidden/>

                    <input name="longitude" id="longitude-hidden" type="text" value="8.390071" hidden/>
                    
                    <button type="button" id="form2button">Search</button>
                </fieldset>

            </form>
            <!-- ############### VS1Lab 1a Form 2 End -->

            <div class="discovery__wrapper">
                <div class="discovery__taglist">
                    <ul class="discovery__results" id="discoveryResults">
                        <li>Castle (49.01379, 8.404435) #sight</li>
                        <li>IWI (49.01379, 8.390071) #edu</li>
                    </ul>
                </div>

                <div id="map" class="discovery__map">
                    <img src="./images/mapview.jpg" alt="a map with locations" id="mapView" />
                    <span>Result map</span>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <span>(c) 2026 HKA_IWI_VSYS</span>
    </footer>
</body>

</html>
