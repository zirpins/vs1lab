<!DOCTYPE html>

<!-- File origin: VS1LAB A1a -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTagApp</title>
    <link rel="stylesheet" href="./stylesheets/style.css" />
</head>

<body>
    <header class="header">
        <img src="./images/location.png" class="header__image" alt="an image of a map and location">
        <h1 class="header__title">GeoTagApp</h1>
        <nav class="header__navigation">
            <a href="#">About</a> | <a href="#">Help</a> | <a href="/">Home</a>
        </nav>
    </header>

    <main class="main">
        <section class="main__tagging tagging">
            <h2>Tagging</h2>

            <form id="tag-form" action="/tagging" method="post">
                <fieldset>
                    <legend>Neuen GeoTag erstellen</legend>

                    <label for="latitude">Latitude: </label>
                    <input type="number" id="latitude" name="latitude"
                           placeholder="Breitengrad"
                           value="49.01379"
                           readonly
                    />

                    <label for="longitude">Longitude: </label>
                    <input type="number" id="longitude" name="longitude"
                           placeholder="Längengrad"
                           value="8.404435"
                           readonly
                    />

                    <label for="name">Name: </label>
                    <input type="text" id="name" name="name"
                           placeholder="Schlossgarten"
                           maxlength="10"
                    />

                    <label for="hashtag">Hashtag: </label>
                    <input type="text" id="hashtag" name="hashtag"
                           placeholder="#park"
                    />

                    <input type="submit" value="GeoTag erstellen"/>
                </fieldset>
            </form>

        </section>

        <section class="main__discovery discovery">
            <h2 class="discovery__title">Discovery</h2>

            <form class="discovery__search"
                  id="discoveryFilterForm"
                  action="/discovery"
                  method="post">

                <fieldset>
                    <legend>GeoTags suchen</legend>

                    <label for="searchterm">Suchbegriff: </label>
                    <input type="text" id="searchterm" name="searchterm"
                           placeholder="Schlossgarten"
                    />

                    <input type="hidden" id="discovery-latitude" name="latitude"
                           placeholder="Breitengrad"
                    />

                    <input type="hidden" id="discovery-longitude" name="longitude"
                           placeholder="Längengrad"
                    />

                    <input type="submit" value="Suchen" />
                </fieldset>
            </form>

            <div class="discovery__wrapper">
                <div class="discovery__taglist">
                    <ul class="discovery__results" id="discoveryResults">
                        <li>Castle (49.01379, 8.404435) #sight</li>
                        <li>IWI (49.01379, 8.390071) #edu</li>
                    </ul>
                </div>

                <div id="map" class="discovery__map">
                    <img src="./images/mapview.jpg" alt="a map with locations" id="mapView" />
                    <span>Result map</span>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <span>(c) 2026 HKA_IWI_VSYS</span>
    </footer>
</body>

</html>
