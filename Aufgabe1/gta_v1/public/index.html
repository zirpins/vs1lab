<!DOCTYPE html>

<!-- File origin: VS1LAB A1a -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTagApp</title>
    <link rel="stylesheet" href="./stylesheets/style.css" />
</head>

<body>
    <header class="header">
        <img src="./images/location.png" class="header__image" alt="an image of a map and location">
        <h1 class="header__title">GeoTagApp</h1>
        <nav class="header__navigation">
            <a href="#">About</a> | <a href="#">Help</a> | <a href="/">Home</a>
        </nav>
    </header>

    <main class="main row">
        <section class= "col-3 main__tagging tagging">
            <h2>Tagging</h2>

            <!-- ############### VS1Lab 1a Form 1 Start -->
            <form id="tag-form" action="/tagging" method="post">

                 <fieldset>
                    <legend>Add a new Geo Tag</legend>
                    <label>Latitude:</label>
                    <input type="text" id="taggingLatitude" name="latitude"
                           readonly
                           placeholder="0.0">
                    <label>Longitude:</label>
                    <input type="text" id="taggingLongitude" name="longitude"
                           readonly
                           placeholder="0.0">
                    <label>Name:</label>
                    <input type="text" id="taggingName" name="name"
                           placeholder="e.g. Central Berlin"
                           required
                           maxlength="10"
                           pattern="[A-Za-zÄÖÜäöüß]{1,10}">
                    <label>Hashtag:</label>
                    <input type="text" id="taggingHashtag" name="hashtag"
                           placeholder="e.g. #ber"
                           maxlength="11"
                           pattern="#[A-Za-zÄÖÜäöüß]{1,10}">
                    <button type="submit">Add Tag</button>
                </fieldset>

            </form>
            <!-- ############### VS1Lab 1a Form 1 End -->

        </section>

        <section class="col-9 main__discovery discovery">
            <h2 class="discovery__title">Discovery</h2>

            <!-- ############### VS1Lab 1a Form 2 Start -->
            <form class="discovery__search" id="discoveryFilterForm" action="/discovery" method="post">

                <fieldset>
                    <legend>Search</legend>
                    <label>Search term or keywords:</label>
                    <input type="text" id="discoverySearchterm" name="searchterm"
                           placeholder="e.g. Berlin"
                           maxlength="11"
                           pattern="#[A-Za-zÄÖÜäöüß]{1,10}">
                    <button type="submit">Search</button>
                </fieldset>

            </form>
            <!-- ############### VS1Lab 1a Form 2 End -->

            <div class="discovery__wrapper row">
                <div class="col-4 discovery__taglist">
                    <ul class="discovery__results" id="discoveryResults">
                        <li>Castle (49.01379, 8.404435) #sight</li>
                        <li>IWI (49.01379, 8.390071) #edu</li>
                    </ul>
                </div>

                <div id="map" class="col-8 discovery__map">
                    <img src="./images/mapview.jpg" alt="a map with locations" id="mapView" />
                    <span>Result map</span>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <span>(c) 2026 HKA_IWI_VSYS</span>
    </footer>
</body>

</html>
