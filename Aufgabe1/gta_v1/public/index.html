<!DOCTYPE html>

<!-- File origin: VS1LAB A1a -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTagApp</title>
    <link rel="stylesheet" href="./stylesheets/style.css" />
</head>

<body>
    <header class="header">
        <img src="./images/location.png" class="header__image" alt="an image of a map and location">
        <h1 class="header__title">GeoTagApp</h1>
        <nav class="header__navigation">
            <a href="#">About</a> | <a href="#">Help</a> | <a href="/">Home</a>
        </nav>
    </header>

    <main class="main row">
        <section class="main__tagging tagging col-4">
            <h2>Tagging</h2>

            <!-- ############### VS1Lab 1a Form 1 Start -->
            <form id="tag-form" action="/tagging" method="post">
                <fieldset>
                    <legend>Add a new Geotag</legend>
                    <label for="latitude">Latitude</label>
                    <input id="latitude" name="latitude" type="text" value="49.01379" readonly />

                    <label for="longitude">Longitude</label>
                    <input id="longitude" name="longitude" type="text" value="8.404435" readonly />

                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" placeholder="e.g. Castle" required maxlength="10" pattern="\p{L}{1,10}" />

                    <label for="hashtag">Hashtag</label>
                    <input id="hashtag" name="hashtag" type="text" placeholder="e.g. #cas" pattern="#\p{L}{1,10}" />

                    <input type="submit" value="Add Tag" />
                </fieldset>
            </form>
            <!-- ############### VS1Lab 1a Form 1 End -->

        </section>

        <section class="main__discovery discovery col-8">
            <h2 class="discovery__title">Discovery</h2>

            <!-- ############### VS1Lab 1a Form 2 Start -->
            <form class="discovery__search" id="discoveryFilterForm" action="/discovery" method="post">
                <fieldset>
                    <legend>Search</legend>

                    <label for="discoverySearchterm">Search term or keywords:</label>
                    <input type="search" id="discoverySearchterm" name="searchterm" placeholder="e.g. #sight">

                    <input type="hidden" id="discoveryLatitude" name="latitude" value="49.01379">

                    <input type="hidden" id="discoveryLongitude" name="longitude" value="8.404435">

                    <button type="submit">Search</button>
                </fieldset>
            </form>
            <!-- ############### VS1Lab 1a Form 2 End -->

            <div class="discovery__wrapper row">
                <div class="discovery__taglist col-6">
                    <ul class="discovery__results" id="discoveryResults">
                        <li>
                            Castle (49.01379, 8.404435)
                            <span class="discovery__hashtag">#sight</span>
                        </li>
                        <li>
                            IWI (49.01379, 8.390071)
                            <span class="discovery__hashtag">#edu</span>
                        </li>
                    </ul>
                </div>

                <div id="map" class="discovery__map col-6">
                    <img src="./images/mapview.jpg" alt="a map with locations" id="mapView" />
                    <span>Result map</span>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <span>(c) 2026 HKA_IWI_VSYS</span>
    </footer>
</body>

</html>
