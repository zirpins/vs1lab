<!DOCTYPE html>

<!-- File origin: VS1LAB A1a -->

<html lang="en">

<head> <!--  alles was ganz oben steht (bild und link)  -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTagApp</title>
    <link rel="stylesheet" href="./stylesheets/style.css" />
</head>

<body>
    <header class="header">
        <img src="./images/location.png" class="header__image" alt="an image of a map and location">
        <h1 class="header__title">GeoTagApp</h1>
        <nav class="header__navigation">
            <a href="#">About</a> | <a href="#">Help</a> | <a href="/">Home</a> <!--  a sind links  -->
        </nav>
    </header>

    <main class="main">
        <section class="main__tagging tagging">
            <h2>Tagging</h2>

            <!-- ############### VS1Lab 1a Form 1 Start -->
            <form id="tag-form" action="/tagging" method="post">

                <!-- ... your code here ... -->
                <form>
                    <fieldset>
                        <legend>Add a new Geotag</legend>

                        <label for="latitude">Latitude:</label>
                        <input type="text" id="latitude" placeholder="48.97004" disabled>

                        <label for="longtitude">Longtitude:</label>
                        <input type="text" id="longtitude" placeholder="8.40216" disabled>

                        <label for="name">Name:</label>
                        <input type="text" id="name" placeholder="e.g. Central Berlin" maxlength="10" required>

                        <label for="hashtag">Hashtag:</label>
                        <input type="text" id="hashtag" placeholder="e.g. #ber" maxlength="10">

                        <input type="submit" value="Add Tag" />
                    </fieldset>


                </form>

            </form>
            <!-- ############### VS1Lab 1a Form 1 End -->

        </section>

        <section class="main__discovery discovery">
            <h2 class="discovery__title">Discovery</h2>

            <!-- ############### VS1Lab 1a Form 2 Start -->
            <form class="discovery__search" id="discoveryFilterForm" action="/discovery" method="post">

                <!-- ... your code here ... -->
                <fieldset>
                    <legend>Search</legend>

                   <!----> <label for="search">Searchterm:</label>
                    <input type="text" id="search" placeholder="e.g. Berlin">

                    <input type="hidden" id="latitude">
                    <input type="hidden" id="longtitude">

                    <input type="submit" value="Search" />

                </fieldset>
            </form>
            <!-- ############### VS1Lab 1a Form 2 End -->

            <div class="discovery__wrapper">
                <div class="discovery__taglist">
                    <ul class="discovery__results" id="discoveryResults">
                        <li>Castle (49.01379, 8.404435) #sight</li>
                        <li>IWI (49.01379, 8.390071) #edu</li>
                    </ul>
                </div>

                <div id="map" class="discovery__map">
                    <img src="./images/mapview.jpg" alt="a map with locations" id="mapView" />
                    <span>Result map</span>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <span>(c) 2026 HKA_IWI_VSYS</span>
    </footer>
</body>

</html>
