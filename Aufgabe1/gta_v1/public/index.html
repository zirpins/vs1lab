<!DOCTYPE html>

<!-- File origin: VS1LAB A1a -->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTagApp</title>
    <link rel="stylesheet" href="./stylesheets/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header">
        <img src="./images/location.png" class="header__image" alt="an image of a map and location" width="50">
        <h1 class="header__title">GeoTagApp</h1>
        <nav class="header__navigation">
            <a href="#">About</a> | <a href="#">Help</a> | <a href="/">Home</a>
        </nav>
    </header>

    <main class="row main" >
        <section class="col-4 main__tagging" >
            <div class="tagging_search">
                <h2>Tagging</h2>
                <!-- ############### VS1Lab 1a Form 1 Start -->
                <form id="tag-form" action="/tagging" method="post">
                    <fieldset>
                        <legend>Add a new GeoTag</legend>
                        <div class="inputs">
                            <label for="latitude">Latitude:</label>
                            <input type="text" id="latitude" name="latitude" placeholder="29.38941" value="49.01379" readonly>

                            <label for="longitude">Longitude:</label>
                            <input type="text" id="longitude" name="longitude" placeholder="8.234743" value="8.404435" readonly>

                            <label for="name">Name:</label>
                            <input type="text" id="name" name="name" placeholder="e.g. Suedstadt"
                                required maxlength="10" pattern="[A-Za-z]{1,10}">

                            <label for="hashtag">Hashtag:</label>
                            <input type="text" id="hashtag" name="hashtag" placeholder="e.g. #ka"
                                maxlength="11" pattern="#[A-Za-z]{1,10}">
                        </div>
                    </fieldset>
                </form>
            </div>
            <!-- ############### VS1Lab 1a Form 1 End -->

        </section>

        <section class="col-8 main__discovery" >
            <div class="discovery_search">
                <h2 class="discovery__title">Discovery</h2>

                <!-- ############### VS1Lab 1a Form 2 Start -->
                <form class="discovery__search" id="discoveryFilterForm" action="/discovery" method="post">
                    <fieldset>
                        <legend>Search</legend>
                        <input type="hidden" id="discovery_latitude" name="latitude" value="49.01379">
                        <input type="hidden" id="discovery_longitude" name="longitude" value="8.404435">
                        <label for="searchterm">Search Term or keywords:</label>
                        <input type="text" id="searchterm" name="searchterm" placeholder="e.g. Vrees">
                        <input type="submit" class="input_submit">
                    </fieldset>
                    </form>
            </div>
            <!-- ############### VS1Lab 1a Form 2 End -->

            <div class="discovery__wrapper row">
                <div class="discovery__taglist col-5">
                    <ul class="discovery__results" id="discoveryResults">
                        <li>Castle (49.01379, 8.404435) #sight</li>
                        <li>IWI (49.01379, 8.390071) #edu</li>
                    </ul>
                </div>

                <div id="map" class="discovery__map col-7" >
                    <img src="./images/mapview.jpg" alt="a map with locations" id="mapView" width="500px"/>
                    <span>Result map</span>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <span>(c) 2026 HKA_IWI_VSYS</span>
    </footer>
</body>

</html>
